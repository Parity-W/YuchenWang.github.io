    <style>
      :root {
        --ink: #183d2c;
        --ink-soft: #426553;
        --paper: rgba(249, 252, 240, 0.88);
        --paper-deep: rgba(239, 247, 224, 0.93);
        --jade: #2d6a49;
        --jade-bright: #6ea86f;
        --gold: #b58b45;
        --line: rgba(31, 83, 57, 0.2);
        --ease-turn: cubic-bezier(0.18, 0.68, 0.18, 1);
        --leaf-height: min(70vh, 710px);
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
      }

      @supports (height: 1svh) {
        :root {
          --leaf-height: min(70svh, 710px);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #143c2a;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        color: var(--ink);
        overflow: hidden;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font: inherit;
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 620px;
        overflow: hidden;
        isolation: isolate;
        background: #1a4732;
      }

      @supports (height: 100dvh) {
        .experience {
          height: 100dvh;
        }
      }

      .scene,
      .wash,
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scene {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        filter: saturate(0.9) contrast(0.94) brightness(0.92);
        transform: scale(1.03);
        animation: spring-breath 14s ease-in-out infinite alternate;
      }

      .experience.is-turning .scene {
        animation-play-state: paused;
      }

      .wash {
        z-index: 1;
        background:
          linear-gradient(180deg, rgba(9, 45, 29, 0.36) 0%, rgba(18, 59, 40, 0.06) 28%, rgba(11, 46, 31, 0.18) 100%),
          radial-gradient(circle at 68% 24%, rgba(235, 252, 188, 0.34), transparent 38%),
          linear-gradient(90deg, rgba(10, 41, 28, 0.22), transparent 46%, rgba(12, 48, 32, 0.12));
      }

      .grain {
        z-index: 2;
        opacity: 0.13;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .book {
        position: relative;
        z-index: 3;
        width: min(100%, 620px);
        height: 100%;
        margin: 0 auto;
      }

      .book::before {
        content: "";
        position: absolute;
        z-index: 7;
        top: max(20px, env(safe-area-inset-top));
        bottom: max(88px, calc(env(safe-area-inset-bottom) + 72px));
        left: clamp(17px, 4.5vw, 28px);
        width: 1px;
        pointer-events: none;
        background: linear-gradient(180deg, transparent, rgba(229, 238, 194, 0.58) 14%, rgba(229, 238, 194, 0.2) 84%, transparent);
      }

      .page {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding:
          max(66px, calc(env(safe-area-inset-top) + 46px))
          clamp(24px, 6.5vw, 44px)
          max(112px, calc(env(safe-area-inset-bottom) + 96px));
        visibility: hidden;
        pointer-events: none;
        z-index: 10;
      }

      .page.is-current {
        visibility: visible;
        pointer-events: auto;
        z-index: 30;
      }

      .page.is-under {
        visibility: visible;
        z-index: 20;
      }

      .leaf {
        position: relative;
        width: 100%;
        max-width: 510px;
        height: var(--leaf-height);
        border: 1px solid rgba(245, 251, 225, 0.76);
        border-radius: 3px 42px 5px 30px;
        background: #f6fae9;
        box-shadow: 0 28px 80px rgba(4, 34, 21, 0.22),
          2px 2px 0 rgba(242, 248, 224, 0.6),
          4px 4px 0 rgba(226, 237, 201, 0.36);
      }

      .page.is-mesh-source .leaf {
        opacity: 0;
        pointer-events: none;
      }

      .book.is-curling .sheet {
        overflow: hidden;
      }

      .curl-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 60;
        opacity: 0;
        pointer-events: none;
      }

      .curl-canvas.is-active {
        opacity: 1;
      }

      .sheet {
        touch-action: pinch-zoom;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        cursor: grab;
      }

      .sheet.is-scrollable {
        touch-action: pan-y pinch-zoom;
      }

      .book.is-curling .sheet {
        cursor: grabbing;
      }

      .page.is-fading .leaf {
        opacity: 0;
        transition: opacity 280ms ease;
      }

      .reduced-motion .page.is-fading .leaf {
        transition-duration: 140ms;
      }

      .sheet {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(30px, 7vw, 54px) clamp(27px, 7vw, 50px);
        background:
          linear-gradient(130deg, rgba(255, 255, 249, 0.94), rgba(238, 248, 221, 0.81)),
          var(--paper);
        border: 0;
        border-radius: inherit;
        box-shadow: none;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .sheet::before {
        content: "";
        position: absolute;
        inset: 13px;
        border: 1px solid rgba(60, 104, 68, 0.1);
        border-radius: 1px 31px 3px 21px;
        pointer-events: none;
      }

      .page-1 .sheet {
        justify-content: space-between;
        background:
          linear-gradient(155deg, rgba(252, 255, 241, 0.93), rgba(235, 247, 216, 0.77)),
          var(--paper);
      }

      .page-2 .sheet {
        padding-top: clamp(28px, 5.6vh, 52px);
        padding-bottom: clamp(28px, 5.6vh, 52px);
      }

      .page-3 .sheet {
        justify-content: center;
        background:
          linear-gradient(150deg, rgba(249, 253, 235, 0.89), rgba(224, 241, 204, 0.77)),
          var(--paper-deep);
      }

      .kicker {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--ink-soft);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.22em;
      }

      .kicker::after {
        content: "";
        display: block;
        width: 34px;
        height: 1px;
        margin-top: 14px;
        background: var(--gold);
        transform-origin: left;
        animation: write-line 1.3s 250ms var(--ease-turn) both;
      }

      .opening {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: clamp(20px, 6vw, 38px);
        margin: clamp(42px, 7vh, 72px) 0 clamp(20px, 4vh, 36px);
      }

      h1,
      h2,
      p {
        text-wrap: pretty;
      }

      .vertical-title {
        grid-column: 2;
        grid-row: 1;
        margin: 0;
        color: var(--jade);
        font-size: clamp(2.45rem, 12vw, 4.2rem);
        font-weight: 500;
        letter-spacing: 0.18em;
        line-height: 1.05;
        writing-mode: vertical-rl;
        text-orientation: upright;
      }

      .opening-copy {
        grid-column: 1;
        grid-row: 1;
        align-self: end;
        padding-bottom: 4px;
      }

      .opening-copy p {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.04rem, 4.4vw, 1.24rem);
        line-height: 2.02;
        letter-spacing: 0.07em;
      }

      .opening-copy p + p {
        margin-top: 1.1em;
      }

      .wish {
        color: var(--jade) !important;
        font-weight: 600;
      }

      .signature {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.94rem;
        letter-spacing: 0.08em;
        text-align: right;
      }

      .signature span {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        letter-spacing: 0.03em;
      }

      .poem-wrap {
        position: relative;
        z-index: 1;
        width: 100%;
      }

      .poem-date {
        margin: 0 0 clamp(24px, 4.5vh, 40px);
        color: var(--ink-soft);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.74rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-align: center;
      }

      .poem {
        margin: 0;
        padding: 0;
        border: 0;
        color: #173b2a;
        font-size: clamp(1.02rem, 4.55vw, 1.3rem);
        line-height: 1.94;
        letter-spacing: clamp(0.02em, 0.55vw, 0.08em);
        text-align: center;
      }

      .poem span {
        display: block;
        white-space: normal;
      }

      .poem span:nth-child(4) {
        margin-bottom: 0.68em;
      }

      .closing {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 2vh 0 3vh;
      }

      .closing h2 {
        margin: 0 0 0.65em;
        color: var(--jade);
        font-size: clamp(2rem, 9vw, 3.4rem);
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      .closing-copy {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.2rem, 5.6vw, 1.65rem);
        line-height: 1.86;
        letter-spacing: 0.1em;
      }

      .to-be-continued {
        position: absolute;
        right: clamp(28px, 7vw, 50px);
        bottom: clamp(26px, 6vw, 44px);
        z-index: 1;
        margin: 0;
        color: rgba(42, 83, 57, 0.57);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.74rem;
        letter-spacing: 0.24em;
        opacity: 0;
      }

      .page-3 .to-be-continued {
        opacity: 1;
      }

      .navigation {
        position: absolute;
        z-index: 100;
        right: max(18px, calc(env(safe-area-inset-right) + 12px));
        bottom: max(18px, calc(env(safe-area-inset-bottom) + 14px));
        left: max(18px, calc(env(safe-area-inset-left) + 12px));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
        max-width: 540px;
        margin: 0 auto;
      }

      .navigation[aria-busy="true"] .nav-button:not([disabled]) {
        opacity: 0.56;
        pointer-events: none;
      }

      .nav-button {
        min-width: 48px;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 16px;
        color: #f7fae9;
        background: rgba(18, 61, 41, 0.75);
        border: 1px solid rgba(231, 242, 202, 0.28);
        border-radius: 999px;
        box-shadow: 0 10px 30px rgba(8, 41, 26, 0.19);
        backdrop-filter: blur(13px);
        -webkit-backdrop-filter: blur(13px);
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 180ms ease, background 180ms ease, opacity 180ms ease;
      }

      .nav-button:first-child {
        justify-self: start;
      }

      .nav-button:last-child {
        justify-self: end;
      }

      .nav-button:active {
        transform: scale(0.96);
      }

      .nav-button:focus-visible {
        outline: 2px solid #f3e7a3;
        outline-offset: 3px;
      }

      .nav-button[disabled] {
        opacity: 0;
        pointer-events: none;
      }

      .nav-button svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nav-label {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.84rem;
        letter-spacing: 0.09em;
      }

      .progress {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: rgba(247, 250, 233, 0.86);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 12px rgba(6, 33, 20, 0.32);
      }

      .progress-line {
        width: 24px;
        height: 1px;
        overflow: hidden;
        background: rgba(247, 250, 233, 0.3);
      }

      .progress-line::after {
        content: "";
        display: block;
        width: 33.333%;
        height: 100%;
        background: #f4e6a0;
        transform: translateX(calc(var(--page-index, 0) * 100%));
        transition: transform 520ms var(--ease-turn);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes spring-breath {
        from { transform: scale(1.03) translate3d(-0.2%, 0, 0); }
        to { transform: scale(1.07) translate3d(0.6%, -0.5%, 0); }
      }

      @keyframes write-line {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }

      @keyframes quiet-arrival {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 420px) {
        .page {
          padding-right: 20px;
          padding-left: 20px;
        }

        .sheet {
          padding-right: 25px;
          padding-left: 25px;
        }

        .opening {
          gap: 16px;
        }

        .poem {
          font-size: clamp(0.97rem, 4.4vw, 1.08rem);
          letter-spacing: 0;
        }

        .nav-label {
          display: none;
        }

        .nav-button {
          width: 48px;
          padding: 0;
        }
      }

      @media (max-height: 740px) {
        :root {
          --leaf-height: 540px;
        }

        .page {
          padding-top: max(48px, calc(env(safe-area-inset-top) + 34px));
          padding-bottom: max(88px, calc(env(safe-area-inset-bottom) + 78px));
        }

        .sheet {
          padding-top: 24px;
          padding-bottom: 24px;
        }

        .opening {
          margin: 26px 0 16px;
        }

        .vertical-title {
          font-size: clamp(2.2rem, 10vh, 3.25rem);
        }

        .opening-copy p {
          font-size: 1rem;
          line-height: 1.8;
        }

        .poem-date {
          margin-bottom: 16px;
        }

        .poem {
          font-size: clamp(0.96rem, 2.6vh, 1.08rem);
          line-height: 1.72;
        }
      }

      @media (orientation: landscape) and (max-height: 560px) {
        :root {
          --leaf-height: calc(100vh - 92px);
        }

        .experience {
          min-height: 100vh;
        }

        @supports (height: 100dvh) {
          :root {
            --leaf-height: calc(100dvh - 92px);
          }

          .experience {
            min-height: 100dvh;
          }
        }

        .page {
          padding:
            max(16px, calc(env(safe-area-inset-top) + 10px))
            max(76px, calc(env(safe-area-inset-right) + 64px))
            max(68px, calc(env(safe-area-inset-bottom) + 58px))
            max(76px, calc(env(safe-area-inset-left) + 64px));
        }

        .leaf {
          max-width: 680px;
        }

        .sheet {
          padding: 20px 40px;
        }

        .opening {
          margin: 8px 0;
        }

        .vertical-title {
          font-size: 2.4rem;
        }

        .opening-copy p {
          font-size: 0.94rem;
          line-height: 1.58;
        }

        .opening-copy p + p {
          margin-top: 0.55em;
        }

        .poem-date {
          margin-bottom: 12px;
        }

        .poem {
          font-size: 0.96rem;
          line-height: 1.52;
        }

        .poem span:nth-child(4) {
          margin-bottom: 0;
        }

        .navigation {
          bottom: max(8px, calc(env(safe-area-inset-bottom) + 6px));
        }
      }

      @media (min-width: 700px) {
        .experience::before,
        .experience::after {
          content: "";
          position: absolute;
          z-index: 2;
          top: 0;
          bottom: 0;
          width: calc((100vw - 620px) / 2 + 1px);
          pointer-events: none;
          background: linear-gradient(90deg, rgba(8, 35, 23, 0.46), rgba(8, 35, 23, 0.06));
        }

        .experience::before { left: 0; }
        .experience::after { right: 0; transform: scaleX(-1); }
      }

      .reduced-motion .scene,
      .reduced-motion .kicker::after,
      .reduced-motion .to-be-continued {
        animation: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .scene, .kicker::after, .to-be-continued {
          animation: none !important;
        }
      }
    </style>

  <body>
    <div class="experience" id="experience" style="--page-index: 0">
      <img
        class="scene"
        src="spring-classroom-portrait.jpg"
        alt=""
        width="1024"
        height="1536"
        decoding="async"
        fetchpriority="high"
      />
      <div class="wash" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <main class="book" id="book" aria-label="写给妈妈的教师节三页信笺" aria-busy="false">
        <section class="page page-1 is-current" data-page="0" style="--page-order: 0" aria-hidden="false" aria-label="第一页，春风有信">
          <div class="leaf">
            <article class="sheet">
                <p class="kicker">二〇二六 · 九月十日</p>

                <div class="opening">
                  <div class="opening-copy">
                    <p>您教孩子们<br />读懂一篇文章。</p>
                    <p>我用了许多年，<br />才慢慢读懂您。</p>
                    <p class="wish">妈妈，教师节快乐。</p>
                  </div>
                  <h1 class="vertical-title">春风有信</h1>
                </div>

                <p class="signature">爱您的，<span>晨儿</span></p>
              </article>
          </div>
        </section>

        <section class="page page-2" data-page="1" style="--page-order: 1" aria-hidden="true" aria-label="第二页，写给妈妈的诗" inert>
          <div class="leaf">
            <article class="sheet">
                <div class="poem-wrap">
                  <p class="poem-date">写于二〇二六年教师节</p>
                  <blockquote class="poem">
                    <span>荣光灵蛇耀华庭，顺意绛帐振玉声。</span>
