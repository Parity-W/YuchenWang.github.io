    <style>
      :root {
        --ink: #183d2c;
        --ink-soft: #426553;
        --paper: rgba(249, 252, 240, 0.88);
        --paper-deep: rgba(239, 247, 224, 0.93);
        --jade: #2d6a49;
        --jade-bright: #6ea86f;
        --gold: #b58b45;
        --line: rgba(31, 83, 57, 0.2);
        --ease-turn: cubic-bezier(0.18, 0.68, 0.18, 1);
        --turn-duration: 1180ms;
        --leaf-height: min(70vh, 710px);
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
      }

      @supports (height: 1svh) {
        :root {
          --leaf-height: min(70svh, 710px);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #143c2a;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        color: var(--ink);
        overflow: hidden;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font: inherit;
      }

      .experience {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100svh;
        min-height: 620px;
        overflow: hidden;
        isolation: isolate;
        background: #1a4732;
      }

      @supports (height: 100dvh) {
        .experience {
          height: 100dvh;
        }
      }

      .scene,
      .wash,
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scene {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        filter: saturate(0.9) contrast(0.94) brightness(0.92);
        transform: scale(1.03);
        animation: spring-breath 14s ease-in-out infinite alternate;
      }

      .experience.is-turning .scene {
        animation-play-state: paused;
      }

      .wash {
        z-index: 1;
        background:
          linear-gradient(180deg, rgba(9, 45, 29, 0.36) 0%, rgba(18, 59, 40, 0.06) 28%, rgba(11, 46, 31, 0.18) 100%),
          radial-gradient(circle at 68% 24%, rgba(235, 252, 188, 0.34), transparent 38%),
          linear-gradient(90deg, rgba(10, 41, 28, 0.22), transparent 46%, rgba(12, 48, 32, 0.12));
      }

      .grain {
        z-index: 2;
        opacity: 0.13;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .book {
        position: relative;
        z-index: 3;
        width: min(100%, 620px);
        height: 100%;
        margin: 0 auto;
        perspective: clamp(1150px, 280vw, 1650px);
        -webkit-perspective: clamp(1150px, 280vw, 1650px);
        perspective-origin: 18% 48%;
        -webkit-perspective-origin: 18% 48%;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        touch-action: pan-y;
      }

      .book::before {
        content: "";
        position: absolute;
        z-index: 7;
        top: max(20px, env(safe-area-inset-top));
        bottom: max(88px, calc(env(safe-area-inset-bottom) + 72px));
        left: clamp(17px, 4.5vw, 28px);
        width: 1px;
        background: linear-gradient(180deg, transparent, rgba(229, 238, 194, 0.58) 14%, rgba(229, 238, 194, 0.2) 84%, transparent);
      }

      .page {
        position: absolute;
        inset: 0;
        z-index: calc(30 - var(--page-order, 0));
        display: grid;
        place-items: center;
        padding:
          max(66px, calc(env(safe-area-inset-top) + 46px))
          clamp(24px, 6.5vw, 44px)
          max(112px, calc(env(safe-area-inset-bottom) + 96px));
        opacity: 1;
        visibility: visible;
        overflow: visible;
        pointer-events: none;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
      }

      .page.is-current {
        z-index: 40;
        pointer-events: auto;
      }

      .book.is-turning .page {
        pointer-events: none;
      }

      .book.is-turning .sheet {
        overflow: hidden;
        -webkit-overflow-scrolling: auto;
      }

      .page.is-turned {
        z-index: 2;
        visibility: hidden;
      }

      .page.is-preparing-reveal,
      .page.is-revealing {
        z-index: 35;
        visibility: visible;
      }

      .page.is-preparing-back,
      .page.is-turning-forward,
      .page.is-turning-back {
        z-index: 70;
        visibility: visible;
      }

      .page.is-receding {
        z-index: 40;
        visibility: visible;
      }

      .leaf,
      .contact-shadow {
        grid-area: 1 / 1;
        width: 100%;
        max-width: 510px;
        height: var(--leaf-height);
      }

      .leaf {
        position: relative;
        z-index: 1;
        transform: translate3d(3px, 2px, -8px) scale(0.994);
        transform-origin: 0.75% 50%;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
      }

      .page.is-current .leaf {
        transform: translate3d(0, 0, 0) rotateY(0deg);
      }

      .page.is-turned .leaf {
        transform: translate3d(0, 0, 0) rotateY(-179.6deg);
      }

      .page.is-turning-forward .leaf,
      .page.is-turning-back .leaf {
        will-change: transform;
        animation-name: leaf-turn;
        animation-duration: var(--turn-duration);
        animation-timing-function: linear;
        animation-fill-mode: both;
      }

      .page.is-turning-back .leaf {
        animation-direction: reverse;
      }

      .page.is-revealing .leaf {
        animation: under-page-rise var(--turn-duration) var(--ease-turn) both;
      }

      .page.is-receding .leaf {
        animation: under-page-rise var(--turn-duration) var(--ease-turn) reverse both;
      }

      .leaf-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 1px solid rgba(245, 251, 225, 0.76);
        border-radius: 3px 42px 5px 30px;
        box-shadow:
          0 28px 80px rgba(4, 34, 21, 0.22),
          inset 0 0 0 1px rgba(42, 100, 64, 0.07);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .leaf-face::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        opacity: 0.18;
        background:
          repeating-linear-gradient(102deg, rgba(47, 91, 54, 0.045) 0 1px, transparent 1px 9px),
          radial-gradient(circle at 78% 21%, rgba(255, 255, 244, 0.68), transparent 27%);
        mix-blend-mode: soft-light;
      }

      .leaf-front {
        background: rgba(247, 251, 235, 0.98);
        transform: rotateY(0deg) translateZ(0.45px);
      }

      .leaf-back {
        background:
          linear-gradient(108deg, rgba(202, 220, 177, 0.92) 0%, rgba(245, 250, 230, 0.99) 18%, rgba(235, 244, 216, 0.98) 72%, rgba(210, 227, 186, 0.96) 100%);
        box-shadow:
          0 28px 78px rgba(4, 34, 21, 0.2),
          inset 12px 0 28px rgba(47, 86, 53, 0.11),
          inset -1px 0 rgba(255, 255, 247, 0.75);
        transform: rotateY(180deg) translateZ(0.45px);
      }

      .sheet-back {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 76% 27%, rgba(137, 176, 112, 0.14), transparent 28%),
          radial-gradient(ellipse at 68% 73%, rgba(113, 158, 94, 0.11), transparent 26%),
          linear-gradient(96deg, rgba(67, 105, 66, 0.1), transparent 12%, transparent 88%, rgba(255, 255, 247, 0.42));
      }

      .sheet-back::before,
      .sheet-back::after {
        content: "";
        position: absolute;
        width: 32%;
        aspect-ratio: 1;
        border: 1px solid rgba(62, 113, 70, 0.1);
        border-radius: 68% 18% 66% 26%;
        transform: rotate(24deg);
      }

      .sheet-back::before {
        top: 12%;
        right: 10%;
      }

      .sheet-back::after {
        right: 23%;
        bottom: 11%;
        transform: scale(0.72) rotate(-32deg);
      }

      .fold-sheen,
      .paper-edge {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 7;
        pointer-events: none;
        opacity: 0;
      }

      .fold-sheen {
        right: -7%;
        width: 48%;
        background:
          linear-gradient(
            90deg,
            transparent 0%,
            rgba(255, 255, 240, 0.06) 31%,
            rgba(255, 255, 249, 0.78) 53%,
            rgba(25, 62, 41, 0.22) 71%,
            transparent 100%
          );
        mix-blend-mode: soft-light;
      }

      .paper-edge {
        right: -1px;
        width: clamp(28px, 10%, 48px);
        transform-origin: left center;
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
        background:
          linear-gradient(90deg, transparent, rgba(255, 255, 247, 0.32) 42%, rgba(44, 78, 50, 0.2) 100%);
      }

      .page.is-turning-forward .fold-sheen,
      .page.is-turning-forward .paper-edge,
      .page.is-turning-back .fold-sheen,
      .page.is-turning-back .paper-edge {
        animation-duration: var(--turn-duration);
        animation-timing-function: linear;
        animation-fill-mode: both;
      }

      .page.is-turning-forward .fold-sheen,
      .page.is-turning-back .fold-sheen {
        animation-name: fold-sheen;
      }

      .page.is-turning-forward .paper-edge,
      .page.is-turning-back .paper-edge {
        animation-name: edge-curl;
      }

      .page.is-turning-back .fold-sheen,
      .page.is-turning-back .paper-edge {
        animation-direction: reverse;
      }

      .contact-shadow {
        position: relative;
        z-index: 0;
        border-radius: 3px 42px 5px 30px;
        opacity: 0;
        pointer-events: none;
        transform-origin: left center;
        background:
          linear-gradient(90deg, rgba(5, 33, 20, 0.36), rgba(7, 42, 25, 0.14) 17%, rgba(8, 39, 24, 0.04) 42%, transparent 68%);
      }

      .page.is-turning-forward .contact-shadow,
      .page.is-turning-back .contact-shadow {
        animation: contact-shadow-turn var(--turn-duration) linear both;
      }

      .page.is-turning-back .contact-shadow {
        animation-direction: reverse;
      }

      .sheet {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(30px, 7vw, 54px) clamp(27px, 7vw, 50px);
        background:
          linear-gradient(130deg, rgba(255, 255, 249, 0.94), rgba(238, 248, 221, 0.81)),
          var(--paper);
        border: 0;
        border-radius: inherit;
        box-shadow: none;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .sheet::before {
        content: "";
        position: absolute;
        inset: 13px;
        border: 1px solid rgba(60, 104, 68, 0.1);
        border-radius: 1px 31px 3px 21px;
        pointer-events: none;
      }

      .page-1 .sheet {
        justify-content: space-between;
        background:
          linear-gradient(155deg, rgba(252, 255, 241, 0.93), rgba(235, 247, 216, 0.77)),
          var(--paper);
      }

      .page-2 .sheet {
        padding-top: clamp(28px, 5.6vh, 52px);
        padding-bottom: clamp(28px, 5.6vh, 52px);
      }

      .page-3 .sheet {
        justify-content: center;
        background:
          linear-gradient(150deg, rgba(249, 253, 235, 0.89), rgba(224, 241, 204, 0.77)),
          var(--paper-deep);
      }

      .kicker {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--ink-soft);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.22em;
      }

      .kicker::after {
        content: "";
        display: block;
        width: 34px;
        height: 1px;
        margin-top: 14px;
        background: var(--gold);
        transform-origin: left;
        animation: write-line 1.3s 250ms var(--ease-turn) both;
      }

      .opening {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: clamp(20px, 6vw, 38px);
        margin: clamp(42px, 7vh, 72px) 0 clamp(20px, 4vh, 36px);
      }

      h1,
      h2,
      p {
        text-wrap: pretty;
      }

      .vertical-title {
        grid-column: 2;
        grid-row: 1;
        margin: 0;
        color: var(--jade);
        font-size: clamp(2.45rem, 12vw, 4.2rem);
        font-weight: 500;
        letter-spacing: 0.18em;
        line-height: 1.05;
        writing-mode: vertical-rl;
        text-orientation: upright;
      }

      .opening-copy {
        grid-column: 1;
        grid-row: 1;
        align-self: end;
        padding-bottom: 4px;
      }

      .opening-copy p {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.04rem, 4.4vw, 1.24rem);
        line-height: 2.02;
        letter-spacing: 0.07em;
      }

      .opening-copy p + p {
        margin-top: 1.1em;
      }

      .wish {
        color: var(--jade) !important;
        font-weight: 600;
      }

      .signature {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--ink-soft);
        font-size: 0.94rem;
        letter-spacing: 0.08em;
        text-align: right;
      }

      .signature span {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        letter-spacing: 0.03em;
      }

      .poem-wrap {
        position: relative;
        z-index: 1;
        width: 100%;
      }

      .poem-date {
        margin: 0 0 clamp(24px, 4.5vh, 40px);
        color: var(--ink-soft);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.74rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-align: center;
      }

      .poem {
        margin: 0;
        padding: 0;
        border: 0;
        color: #173b2a;
        font-size: clamp(1.02rem, 4.55vw, 1.3rem);
        line-height: 1.94;
        letter-spacing: clamp(0.02em, 0.55vw, 0.08em);
        text-align: center;
      }

      .poem span {
        display: block;
        white-space: normal;
      }

      .poem span:nth-child(4) {
        margin-bottom: 0.68em;
      }

      .closing {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 2vh 0 3vh;
      }

      .closing h2 {
        margin: 0 0 0.65em;
        color: var(--jade);
        font-size: clamp(2rem, 9vw, 3.4rem);
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      .closing-copy {
        margin: 0;
        color: var(--ink);
        font-size: clamp(1.2rem, 5.6vw, 1.65rem);
        line-height: 1.86;
        letter-spacing: 0.1em;
      }

      .to-be-continued {
        position: absolute;
        right: clamp(28px, 7vw, 50px);
        bottom: clamp(26px, 6vw, 44px);
        z-index: 1;
        margin: 0;
        color: rgba(42, 83, 57, 0.57);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.74rem;
        letter-spacing: 0.24em;
        opacity: 0;
      }

      .page-3.is-current .to-be-continued,
      .page-3.is-revealing .to-be-continued {
        animation: quiet-arrival 1.2s 900ms ease both;
      }

      .navigation {
        position: absolute;
        z-index: 100;
        right: max(18px, calc(env(safe-area-inset-right) + 12px));
        bottom: max(18px, calc(env(safe-area-inset-bottom) + 14px));
        left: max(18px, calc(env(safe-area-inset-left) + 12px));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 14px;
        max-width: 540px;
        margin: 0 auto;
      }

      .navigation[aria-busy="true"] .nav-button {
        opacity: 0.56;
        pointer-events: none;
      }

      .nav-button {
        min-width: 48px;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 16px;
        color: #f7fae9;
        background: rgba(18, 61, 41, 0.75);
        border: 1px solid rgba(231, 242, 202, 0.28);
        border-radius: 999px;
        box-shadow: 0 10px 30px rgba(8, 41, 26, 0.19);
        backdrop-filter: blur(13px);
        -webkit-backdrop-filter: blur(13px);
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 180ms ease, background 180ms ease, opacity 180ms ease;
      }

      .nav-button:first-child {
        justify-self: start;
      }

      .nav-button:last-child {
        justify-self: end;
      }

      .nav-button:active {
        transform: scale(0.96);
      }

      .nav-button:focus-visible {
        outline: 2px solid #f3e7a3;
        outline-offset: 3px;
      }

      .nav-button[disabled] {
        opacity: 0;
        pointer-events: none;
      }

      .nav-button svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .nav-label {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 0.84rem;
        letter-spacing: 0.09em;
      }

      .progress {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: rgba(247, 250, 233, 0.86);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 12px rgba(6, 33, 20, 0.32);
      }

      .progress-line {
        width: 24px;
        height: 1px;
        overflow: hidden;
        background: rgba(247, 250, 233, 0.3);
      }

      .progress-line::after {
        content: "";
        display: block;
        width: 33.333%;
        height: 100%;
        background: #f4e6a0;
        transform: translateX(calc(var(--page-index, 0) * 100%));
        transition: transform 520ms var(--ease-turn);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes spring-breath {
        from { transform: scale(1.03) translate3d(-0.2%, 0, 0); }
        to { transform: scale(1.07) translate3d(0.6%, -0.5%, 0); }
      }

      @keyframes leaf-turn {
        0% {
          transform: translate3d(0, 0, 0) rotateY(0deg) rotateZ(0deg);

      }

      .motion-lite .page {
        opacity: 0;
        visibility: hidden;
      }

      .motion-lite .page.is-current,
      .motion-lite .page.is-preparing-reveal,
      .motion-lite .page.is-preparing-back,
      .motion-lite .page.is-revealing,
      .motion-lite .page.is-receding,

  <body>
    <div class="experience" id="experience" style="--page-index: 0">
      <img
        class="scene"
        src="spring-classroom-portrait.jpg"
        alt=""
        width="1024"
        height="1536"
        decoding="async"
        fetchpriority="high"

      <div class="wash" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <main class="book" id="book" aria-label="写给妈妈的教师节三页信笺" aria-busy="false">
        <section class="page page-1 is-current" data-page="0" style="--page-order: 0" aria-hidden="false" aria-label="第一页，春风有信">
          <span class="contact-shadow" aria-hidden="true"></span>
          <div class="leaf">
            <div class="leaf-face leaf-front">
              <article class="sheet">
                <p class="kicker">二〇二六 · 九月十日</p>

                <div class="opening">
                  <div class="opening-copy">
                    <p>您教孩子们<br />读懂一篇文章。</p>
                    <p>我用了许多年，<br />才慢慢读懂您。</p>
                    <p class="wish">妈妈，教师节快乐。</p>
                  </div>
                  <h1 class="vertical-title">春风有信</h1>
                </div>

                <p class="signature">爱您的，<span>晨儿</span></p>
              </article>
              <span class="fold-sheen" aria-hidden="true"></span>
              <span class="paper-edge" aria-hidden="true"></span>
            </div>
            <div class="leaf-face leaf-back" aria-hidden="true">
              <div class="sheet-back"></div>
              <span class="fold-sheen" aria-hidden="true"></span>
              <span class="paper-edge" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <section class="page page-2" data-page="1" style="--page-order: 1" aria-hidden="true" aria-label="第二页，写给妈妈的诗" inert>
          <span class="contact-shadow" aria-hidden="true"></span>
          <div class="leaf">
            <div class="leaf-face leaf-front">
              <article class="sheet">
                <div class="poem-wrap">
                  <p class="poem-date">写于二〇二六年教师节</p>
                  <blockquote class="poem">
                    <span>荣光灵蛇耀华庭，顺意绛帐振玉声。</span>
                    <span>升迁墨海传薪盛，利泽文峰揽月荣。</span>
                    <span>副高四九织锦路，转任一园稚子风。</span>

        <nav class="navigation" aria-label="信笺翻页" aria-busy="false">
          <button class="nav-button" id="previousPage" type="button" aria-label="翻到上一页" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            <span class="nav-label">上一页</span>

            <span id="currentPage">01</span>

    <script>
      (() => {
        const pages = Array.from(document.querySelectorAll(".page"));
        const experience = document.getElementById("experience");
        const book = document.getElementById("book");
        const navigation = document.querySelector(".navigation");
        const previousButton = document.getElementById("previousPage");
        const nextButton = document.getElementById("nextPage");
        const nextLabel = document.getElementById("nextLabel");
        const currentPage = document.getElementById("currentPage");
        const announcement = document.getElementById("pageAnnouncement");
        const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        const temporaryClasses = [
          "is-preparing-reveal",
          "is-preparing-back",
          "is-revealing",
          "is-receding",
          "is-turning-forward",
          "is-turning-back"
        ];
        const mainAnimationNames = new Set([
          "leaf-turn",
          "motion-lite-out",
          "motion-lite-in",
          "motion-lite-out-back",
          "motion-lite-in-back",
          "motion-quiet-out",
          "motion-quiet-in"
        ]);
        const supports = (property, value) => Boolean(window.CSS && CSS.supports && CSS.supports(property, value));
        const supportsRichTurn =
          supports("perspective", "1px") &&
          supports("transform-style", "preserve-3d") &&
          supports("transform", "rotateY(1deg)") &&
          (supports("backface-visibility", "hidden") || supports("-webkit-backface-visibility", "hidden"));

        const state = {
          index: 0,
          phase: "idle",
          direction: null,
          token: 0
        };

        let pointerGesture = null;
        let touchFallbackStart = null;
        let pendingTarget = null;
        let activeFinish = null;
        let safetyTimer = 0;

        document.documentElement.classList.toggle("motion-lite", !supportsRichTurn);
        document.documentElement.classList.toggle("motion-none", motionQuery.matches);

        const updateControls = () => {
          previousButton.disabled = state.index === 0;
          nextButton.disabled = state.index === pages.length - 1;
          nextLabel.textContent = state.index === pages.length - 2 ? "写到后来" : "翻页";
          currentPage.textContent = String(state.index + 1).padStart(2, "0");
          experience.style.setProperty("--page-index", String(state.index));
          announcement.textContent = `当前为第 ${state.index + 1} 页，共 ${pages.length} 页`;
        };

        const setBusy = (busy) => {
          experience.classList.toggle("is-turning", busy);
          book.classList.toggle("is-turning", busy);
          book.setAttribute("aria-busy", String(busy));
          navigation.setAttribute("aria-busy", String(busy));
          [previousButton, nextButton].forEach((button) => {
            if (busy) {
              button.setAttribute("aria-disabled", "true");
            } else {
              button.removeAttribute("aria-disabled");
            }
          });
        };

        const settlePageStates = () => {
          window.clearTimeout(safetyTimer);
          safetyTimer = 0;
          activeFinish = null;
          pendingTarget = null;
          state.direction = null;

          pages.forEach((page, pageIndex) => {
            page.classList.remove(...temporaryClasses);
            page.classList.toggle("is-current", pageIndex === state.index);
            page.classList.toggle("is-turned", pageIndex < state.index);
            page.setAttribute("aria-hidden", pageIndex === state.index ? "false" : "true");
            if (pageIndex === state.index) {
              page.removeAttribute("inert");
            } else {
              page.setAttribute("inert", "");
            }
          });

          setBusy(false);
          updateControls();
        };

        const forceFinish = () => {
          if (typeof activeFinish === "function") {
            activeFinish();
            return;
          }

          if (state.phase !== "idle" && Number.isInteger(pendingTarget)) {
            state.token += 1;
            state.index = pendingTarget;
            state.phase = "idle";
            settlePageStates();
          }
        };

        const safetyDelay = () => {
          if (document.documentElement.classList.contains("motion-none")) return 420;
          if (document.documentElement.classList.contains("motion-lite")) return 900;
          return 1650;
        };

        const turnTo = (nextIndex) => {
          if (
            state.phase !== "idle" ||
            nextIndex < 0 ||
            nextIndex >= pages.length ||
            nextIndex === state.index ||
            Math.abs(nextIndex - state.index) !== 1
          ) return false;

          const originalIndex = state.index;
          const token = ++state.token;
          const direction = nextIndex > originalIndex ? "forward" : "back";
          const current = pages[originalIndex];
          const incoming = pages[nextIndex];
          const turningLeaf = (direction === "forward" ? current : incoming).querySelector(".leaf");
          const incomingSheet = incoming.querySelector(".sheet");

          state.phase = "preparing";
          state.direction = direction;
          pendingTarget = nextIndex;
          pointerGesture = null;
          setBusy(true);

          if (incomingSheet) incomingSheet.scrollTop = 0;
          incoming.classList.add(direction === "forward" ? "is-preparing-reveal" : "is-preparing-back");

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (token !== state.token || state.phase !== "preparing") return;

              state.phase = "turning";
              let finished = false;

              const completeTurn = (commit) => {
                if (finished || token !== state.token) return;
                finished = true;
                turningLeaf.removeEventListener("animationend", onAnimationEnd);
                turningLeaf.removeEventListener("animationcancel", onAnimationCancel);
                window.clearTimeout(safetyTimer);
                safetyTimer = 0;
                activeFinish = null;
                state.phase = "settling";
                state.index = commit ? nextIndex : originalIndex;
                state.phase = "idle";
                settlePageStates();
              };

              const isMainAnimation = (event) =>
                event.target === turningLeaf && mainAnimationNames.has(event.animationName);

              const onAnimationEnd = (event) => {
                if (isMainAnimation(event)) completeTurn(true);
              };

              const onAnimationCancel = (event) => {
                if (isMainAnimation(event)) completeTurn(false);
              };

              activeFinish = () => completeTurn(true);
              turningLeaf.addEventListener("animationend", onAnimationEnd);
              turningLeaf.addEventListener("animationcancel", onAnimationCancel);

              if (direction === "forward") {
                incoming.classList.remove("is-preparing-reveal");
                incoming.classList.add("is-revealing");
                current.classList.add("is-turning-forward");
              } else {
                incoming.classList.remove("is-preparing-back");
                incoming.classList.add("is-turning-back");
                current.classList.add("is-receding");
              }

              safetyTimer = window.setTimeout(() => completeTurn(true), safetyDelay());
            });
          });

          return true;
        };

        const resetPointerGesture = (event) => {
          if (!pointerGesture || !event || pointerGesture.id === event.pointerId) {
            pointerGesture = null;
          }
        };

        previousButton.addEventListener("click", () => turnTo(state.index - 1));
        nextButton.addEventListener("click", () => turnTo(state.index + 1));

        document.addEventListener("keydown", (event) => {
          if (event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable='true']")) return;

          let accepted = false;
          if (event.key === "ArrowRight" || event.key === "PageDown") accepted = turnTo(state.index + 1);
          if (event.key === "ArrowLeft" || event.key === "PageUp") accepted = turnTo(state.index - 1);
          if (accepted) event.preventDefault();
        });

        if ("PointerEvent" in window) {
          book.addEventListener("pointerdown", (event) => {
            if (
              state.phase !== "idle" ||
              event.pointerType === "mouse" ||
              event.isPrimary === false ||
              event.target.closest(".navigation")
            ) return;

            pointerGesture = {
              id: event.pointerId,
              x: event.clientX,
              y: event.clientY,
              time: event.timeStamp
            };

            try {
              book.setPointerCapture(event.pointerId);
            } catch (_) {
              /* Pointer capture is an enhancement; XWeb may decline it. */
            }
          });

          book.addEventListener("pointerup", (event) => {
            if (!pointerGesture || pointerGesture.id !== event.pointerId) return;
            const start = pointerGesture;
            pointerGesture = null;

            try {
              if (book.hasPointerCapture(event.pointerId)) book.releasePointerCapture(event.pointerId);
            } catch (_) {
              /* The pointer may already have been released by the browser. */
            }

            const deltaX = event.clientX - start.x;
            const deltaY = event.clientY - start.y;
            const elapsed = Math.max(16, event.timeStamp - start.time);
            const horizontal = Math.abs(deltaX) > Math.abs(deltaY) * 1.3;
            const deliberate = Math.abs(deltaX) > 54 || (Math.abs(deltaX / elapsed) > 0.45 && Math.abs(deltaX) > 28);

            if (horizontal && deliberate) turnTo(deltaX < 0 ? state.index + 1 : state.index - 1);
          });

          book.addEventListener("pointercancel", resetPointerGesture);
          book.addEventListener("lostpointercapture", resetPointerGesture);
        } else {
          book.addEventListener("touchstart", (event) => {
            if (state.phase !== "idle" || event.touches.length !== 1 || event.target.closest(".navigation")) {
              touchFallbackStart = null;
              return;
            }
            const touch = event.touches[0];
            touchFallbackStart = { x: touch.clientX, y: touch.clientY, time: event.timeStamp };
          }, { passive: true });

          book.addEventListener("touchend", (event) => {
            if (!touchFallbackStart || event.changedTouches.length !== 1) {
              touchFallbackStart = null;
              return;
            }

            const start = touchFallbackStart;
            const touch = event.changedTouches[0];
            touchFallbackStart = null;
            const deltaX = touch.clientX - start.x;
            const deltaY = touch.clientY - start.y;
            const elapsed = Math.max(16, event.timeStamp - start.time);
            const horizontal = Math.abs(deltaX) > Math.abs(deltaY) * 1.3;
            const deliberate = Math.abs(deltaX) > 54 || (Math.abs(deltaX / elapsed) > 0.45 && Math.abs(deltaX) > 28);

            if (horizontal && deliberate) turnTo(deltaX < 0 ? state.index + 1 : state.index - 1);
          }, { passive: true });

          book.addEventListener("touchcancel", () => { touchFallbackStart = null; }, { passive: true });
        }

        const syncMotionPreference = () => {
          document.documentElement.classList.toggle("motion-none", motionQuery.matches);
          if (state.phase !== "idle") forceFinish();
        };

        if (motionQuery.addEventListener) {
          motionQuery.addEventListener("change", syncMotionPreference);
        } else if (motionQuery.addListener) {
          motionQuery.addListener(syncMotionPreference);
        }

        document.addEventListener("visibilitychange", () => {
          if (document.hidden && state.phase !== "idle") forceFinish();
        });
        window.addEventListener("pagehide", forceFinish);
        window.addEventListener("blur", () => {
          pointerGesture = null;
          touchFallbackStart = null;
        });

        settlePageStates();
      })();
    </script>
  </body>
</html>
